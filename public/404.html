<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Leaves — 叶子</title>
    <!-- GitHub Pages serves this for any unknown path (i.e. any client-side
         route, since there's no server to rewrite them to index.html). It
         re-encodes the path as a query string and redirects to the app root,
         where the script in index.html decodes it back into a real route.
         https://github.com/rafgraph/spa-github-pages -->
    <script type="text/javascript">
      var pathSegmentsToKeep = 1; // keep the "/Team-1" repo-name segment

      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname
            .split("/")
            .slice(0, 1 + pathSegmentsToKeep)
            .join("/") +
          "/?/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(pathSegmentsToKeep)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
